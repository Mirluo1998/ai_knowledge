# Knowledge Service 配置文件
# 通过环境变量 APP_ENV 切换环境：development / staging / production
# 环境变量可以覆盖对应字段（优先级：env var > yaml > 默认值）

# 开发环境（默认）
development:
  server:
    addr: ":8080"
    read_header_timeout: "5s"
    read_timeout: "10s"
    write_timeout: "15s"
    idle_timeout: "60s"
    shutdown_timeout: "10s"
    health_check_timeout: "2s"

  database:
    driver: "mysql"
    dsn: "root:Lpf@123456@tcp(www.hiluo.top:3306)/assistant_knowledge?parseTime=true&loc=Local&charset=utf8mb4"
    max_open_conns: 25
    max_idle_conns: 10
    conn_max_lifetime: "5m"

  log:
    level: "debug"
    format: "text"

# 预发布环境
staging:
  server:
    addr: ":8080"
    read_header_timeout: "5s"
    read_timeout: "15s"
    write_timeout: "30s"
    idle_timeout: "120s"
    shutdown_timeout: "15s"
    health_check_timeout: "3s"

  database:
    driver: "mysql"
    dsn: "staging_user:staging_pass@tcp(staging-db:3306)/knowledge?parseTime=true&loc=Local&charset=utf8mb4"
    max_open_conns: 50
    max_idle_conns: 20
    conn_max_lifetime: "10m"

  log:
    level: "info"
    format: "json"

# 生产环境
production:
  server:
    addr: ":8080"
    read_header_timeout: "10s"
    read_timeout: "30s"
    write_timeout: "60s"
    idle_timeout: "180s"
    shutdown_timeout: "30s"
    health_check_timeout: "5s"

  database:
    driver: "mysql"
    dsn: "prod_user:prod_pass@tcp(prod-db:3306)/knowledge?parseTime=true&loc=Local&charset=utf8mb4"
    max_open_conns: 100
    max_idle_conns: 30
    conn_max_lifetime: "15m"

  log:
    level: "info"
    format: "json"
